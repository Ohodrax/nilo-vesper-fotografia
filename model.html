<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.min.js" integrity="sha384-Rx+T1VzGupg4BHQYs2gCW9It+akI2MM/mndMCy36UVfodzcJcF0GGLxZIzObiEfa" crossorigin="anonymous"></script>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-width: 100%;
            min-height: 100vh;
        }
        input[type="file"] {
            display: none;
        }
        .content {
            max-width: 1440px;
            overflow: hidden;
            margin: auto;
        }
        .new-image-box {
            width: 100%;
            height: 230px;
            border: 5px dashed #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: relative;
            transition: all .3s;
        }
        .new-image-box label {
            width: 100%;
            height: 100%;
            position: absolute;
            cursor: pointer;
        }
        .new-image-box:hover {
            background-color: rgba(0, 0, 0, .05);
        }
        .new-image-box:hover > .new-image-content-box {
            transform: scale(1.1);
        }


        .new-image-content-box {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: -1;
            transition: all .3s;
            font-size: 20px;
        }
        .new-image-content-box i {
            font-size: 50px;
            color: #000000;
        }        

        .image-render-box {
            width: 100%;
            height: 100%;
            cursor: grab;
            overflow-x: hidden;
            display: flex;
            flex-direction: row;
            padding: 15px 45px;
            position: relative;
            align-items: center;
            white-space: nowrap;
            transition: all 0.2s;
            /*transform: scale(0.98);*/
            will-change: transform;
            user-select: none;
            cursor: pointer;
        }
        .image-render-box.active {
            /* background: rgba(255, 255, 255, 0.3); */
            cursor: grabbing;
            cursor: -webkit-grabbing;
            /* transform: scale(0.99); */
        }

        .single-image-box {
            position: relative;
            width: 280px;
            height: 100%;
            margin: 0 15px 0 15px;
            object-fit: cover;
        }
        .single-image-box img {
            width: 280px;
            height: 100%;
            object-fit: cover;
        }
        .single-image-box span {
            position: absolute;
            padding: 10px;
            background-color: crimson;
            right: 0;
            top: 0;
            border-radius: 100%;
            width: 50px;
            height: 50px;
            margin-top: -15px;
            margin-right: -15px;
            text-align: center;
            transition: all .3s;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 500;
        }
        .single-image-box span:hover {
            transform: scale(1.05);
            cursor: pointer;
        }
        .single-image-box span i {
            font-size: 24px;
            color: #fff;
        }

        .arrow {
            position: absolute;
            display: flex;
            align-items: center;
            height: 100%;
            padding: 0 5px 0 5px;
            z-index: 1;
            top: 0;
        }
        .arrow-left {
            left: 0%;
            /* background: linear-gradient(to right, rgba(0, 0, 0, .3), transparent, transparent); */
        }
        .arrow-right {
            right: 0%;
            /* background: linear-gradient(to left, rgba(0, 0, 0, .3), transparent, transparent); */
        }
        .arrow i {
            font-size: 40px;
            color: #fdfdfd;
        }

        .set-parallax-image {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 500px;
            color: #fff;
            position: relative;
            transition: all .3s;
        }
        .set-parallax-image-empty {
            color: #000;
            border: 5px dashed #000;
        }
        .set-parallax-image label {
            position: absolute;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .set-parallax-image img {
            object-fit: cover;
            object-position: center;
            width: 100%;
            height: 100%;
            filter: brightness(0.7);
            z-index: -1;
        }
        .set-parallax-image:hover {
            filter: brightness(0.9);
        }
        .set-parallax-image:hover > .new-banner-box {
            transform: scale(1.1);
        }

        .new-banner-box {
            position: absolute;
            width: 230px;
            height: 230px;
            border: 5px dashed #fff;
            border-radius: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            margin: auto;
            transition: all .3s;
            font-size: 20px;
            z-index: -1;
        }
        .new-banner-box-empty {
            border: 5px dashed #000;
        }
        .new-banner-box i {
            font-size: 50px;
        }

    </style>
</head>
<body>
    <section class="content">
        <div class="row">
            <div class="col-12">
                <h1 class="mb-3">Gestão de imagens</h1>
            </div>
        </div>
    </section>

    <section class="content">
        <div class="row">
            <div class="col-12 col-md-3 d-flex justify-content-start mb-3">
                <div class="new-image-box">

                    <input type="file" id="fileInputCarrossel1">
                    <label for="fileInputCarrossel1"></label>

                    <div class="new-image-content-box">
                        <i class="bi bi-camera"></i>
                        <span>Insira novas imagens aqui</span>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-9 mb-3">
                <div style="width: 100%;height: 100%;position: relative;">
                    <div class="arrow arrow-left" onclick="arrowSlide(`left`)">
                        <i class="bi bi-chevron-left"></i>
                    </div>
                    
                    <div class="image-render-box" id="image-render-box">

                        <div class="single-image-box">
                            <img src="https://images.pexels.com/photos/36717/amazing-animal-beautiful-beautifull.jpg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="Image">
                            <span><i class="bi bi-trash"></i></span>
                        </div>
                        <div class="single-image-box">
                            <img src="https://images.pexels.com/photos/36717/amazing-animal-beautiful-beautifull.jpg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="Image">
                            <span><i class="bi bi-trash"></i></span>
                        </div>
                        <div class="single-image-box">
                            <img src="https://images.pexels.com/photos/36717/amazing-animal-beautiful-beautifull.jpg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="Image">
                            <span><i class="bi bi-trash"></i></span>
                        </div>
                        <div class="single-image-box">
                            <img src="https://images.pexels.com/photos/36717/amazing-animal-beautiful-beautifull.jpg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="Image">
                            <span><i class="bi bi-trash"></i></span>
                        </div>
                        <div class="single-image-box">
                            <img src="https://images.pexels.com/photos/36717/amazing-animal-beautiful-beautifull.jpg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="Image">
                            <span><i class="bi bi-trash"></i></span>
                        </div>
                        <div class="single-image-box">
                            <img src="https://images.pexels.com/photos/36717/amazing-animal-beautiful-beautifull.jpg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="Image">
                            <span><i class="bi bi-trash"></i></span>
                        </div>

                    </div>
                    
                    <div class="arrow arrow-right" onclick="arrowSlide(`right`)">
                        <i class="bi bi-chevron-right"></i>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="content">
        <div class="row">
            <div class="col-12">
                <h1 class="mb-3">Banner Parallax 1</h1>
            </div>
        </div>
    </section>

    <section class="content">
        <div class="row">
            <div class="col-12">
                <div class="set-parallax-image">

                    <input type="file" id="fileInputBanner">
                    <label for="fileInputBanner"></label>

                    <img src="https://images.pexels.com/photos/36717/amazing-animal-beautiful-beautifull.jpg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="Image">

                    <div class="new-banner-box">
                        <i class="bi bi-camera"></i>
                        <span>Nova imagem</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        const slider = document.querySelector('.image-render-box');
        let isDown = false;
        let startX;
        let scrollLeft;

        slider.addEventListener('mousedown', (e) => {
            isDown = true;
            slider.classList.add('active');
            startX = e.pageX - slider.offsetLeft;
            scrollLeft = slider.scrollLeft;
        });
        slider.addEventListener('mouseleave', () => {
            isDown = false;
            slider.classList.remove('active');
        });
        slider.addEventListener('mouseup', () => {
            isDown = false;
            slider.classList.remove('active');
        });
        slider.addEventListener('mousemove', (e) => {
            if(!isDown) return;

            e.preventDefault();
            const x = e.pageX - slider.offsetLeft;
            const walk = (x - startX) * 2; //scroll-fast
            slider.scrollLeft = scrollLeft - walk;
            // console.log(walk);
        });

        function arrowSlide(to) {
            let scrollTime = 0;

            let timerSlide = setInterval(() => {
                scrollTime++;

                if (scrollTime > 25) {
                    clearInterval(timerSlide);
                } else {
                    
                    slider.scrollLeft = to == "right" ? slider.scrollLeft + scrollTime : slider.scrollLeft - scrollTime;
                }
            }, 10);
        }
    </script>
</body>
</html>
