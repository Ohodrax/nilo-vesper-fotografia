<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toast Notification</title>

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700;800;900&family=Poppins&family=Sora:wght@300;400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #f7edff;
        }
        
        .buttons {
            margin: 50px;
        }

        .buttons button {
            background: #333;
            color: #fff;
            border: 0;
            outline: 0;
            width: 120px;
            height: 40px;
            margin: 5;
            cursor: pointer;
        }

        #toastBox {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            align-items: flex-end;
            flex-direction: column;
            overflow: hidden;
            padding: 20px;
        }

        .toast {
            width: 400px;
            height: 80px;
            background: #fff;
            font-weight: 500;
            margin: 15px 0;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            position: relative;
            transform: translateX(100%);
            animation: moveleft 0.3s linear forwards;
            border-bottom: 0;
        }

        @keyframes moveleft {
            0% {
                transform: translateX(100%);
            }

            80% {
                transform: translateX(-10%);
            }
            
            100% {
                transform: translateX(0%);
            }
        }

        .toast i {
            margin: 0 20px;
            font-size: 35px;
        }
        
        .toast-success i {
            color: seagreen;
        } 
        
        .toast-error i {
            color: red;
        } 
        
        .toast-info i {
            color: gold;
        }

        .toast::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 5px;
            background: seagreen;
            animation: anim 5s linear forwards;
        }

        @keyframes anim {
            100% {
                width: 0%;
            }
        }

        .toast-error::after {
            background: red;
        }

        .toast-info::after {
            background: orange;
        }

        .toast-out {
            animation: moveout 0.3s linear forwards;
        }

        @keyframes moveout {
            0% {
                transform: translateX(-5%);
            }

            90% {
                transform: translateX(100%);
            }

            100% {
                transform: translateX(110%);
            }
        }
    </style>
</head>
<body>
    <div class="buttons">
        <button onclick="showToast(`Mensagem de sucesso`, true)">Success</button>
        <button onclick="showToast(`Mensagem de erro`, false)">Error</button>
        <button onclick="showToast(`Mensagem de aviso`)">Invalid</button>
    </div>

    <div id="toastBox"></div>

    <script>
        function showToast(msg, ret) {
            let toastBox = document.getElementById("toastBox");
            let toast = document.createElement("div");
            let icon;
            toast.classList.add("toast");

            if (ret === undefined) {
                icon = `<i class='bx bxs-error-circle'></i>`;
                toast.classList.add("toast-info");
            } else {
                if (ret) {
                    icon = `<i class='bx bxs-check-circle'></i>`;
                    toast.classList.add("toast-success");
                } else {
                    toast.classList.add("toast-error");
                    icon = `<i class='bx bxs-x-circle'></i>`;
                }
            }

            setTimeout(() => {
                toast.classList.add("toast-out");
            }, 5000);
            
            toast.innerHTML = `${icon} ${msg}`;
            
            toastBox.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 6000);
        }
    </script>
</body>
</html>
